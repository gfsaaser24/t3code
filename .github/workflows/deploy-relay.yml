name: Deploy T3 Connect relay

# T3 Turbo: production relay deploys run from the fork's product mainline (`turbo`), where the
# relay source actually changes. This branch has diverged from it, so a push-triggered deploy here
# would ship stale relay code over the live one — it is how the speed-plan relay work stayed out of
# production. Manual dispatch only.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: none
  statuses: write

concurrency:
  group: relay-production
  cancel-in-progress: false

jobs:
  deploy_relay:
    name: Deploy production relay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_HOST: ${{ vars.DATABASE_HOST }}
      DATABASE_PORT: ${{ vars.DATABASE_PORT }}
      DATABASE_NAME: ${{ vars.DATABASE_NAME }}
      DATABASE_USER: ${{ vars.DATABASE_USER }}
      # Legacy managed-PlanetScale fallback; DATABASE_* takes precedence.
      PLANETSCALE_ORGANIZATION: ${{ vars.PLANETSCALE_ORGANIZATION }}
      # Optional tracing; an incomplete Axiom pair disables export.
      AXIOM_ORG_ID: ${{ vars.AXIOM_ORG_ID }}
      RELAY_DOMAIN: ${{ vars.RELAY_DOMAIN }}
      RELAY_API_ZONE_NAME: ${{ vars.RELAY_API_ZONE_NAME }}
      RELAY_TUNNEL_ZONE_NAME: ${{ vars.RELAY_TUNNEL_ZONE_NAME }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      CLERK_JWT_AUDIENCE: ${{ vars.CLERK_JWT_AUDIENCE }}
      # Optional iOS push; an incomplete APNS_* set disables the APNs resources and runtime.
      APNS_ENVIRONMENT: ${{ vars.APNS_ENVIRONMENT }}
      APNS_TEAM_ID: ${{ vars.APNS_TEAM_ID }}
      APNS_KEY_ID: ${{ vars.APNS_KEY_ID }}
      APNS_BUNDLE_ID: ${{ vars.APNS_BUNDLE_ID }}
      ALCHEMY_TELEMETRY_DISABLED: "1"
    steps:
      - id: cloudflare_config
        name: Detect Cloudflare configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" && -n "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Relay deployment skipped because Cloudflare credentials are not configured."

      - name: Checkout
        if: steps.cloudflare_config.outputs.enabled == 'true'
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        if: steps.cloudflare_config.outputs.enabled == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3code-relay...

      - name: Report optional relay services
        if: steps.cloudflare_config.outputs.enabled == 'true'
        shell: bash
        env:
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
        run: |
          if [[ -z "${AXIOM_TOKEN:-}" || -z "${AXIOM_ORG_ID:-}" ]]; then
            echo "::notice::Axiom is not fully configured; hosted tracing is disabled."
          fi

          if [[ -z "${APNS_PRIVATE_KEY:-}" || -z "${APNS_ENVIRONMENT:-}" || -z "${APNS_TEAM_ID:-}" || -z "${APNS_KEY_ID:-}" || -z "${APNS_BUNDLE_ID:-}" ]]; then
            echo "::notice::APNs is not fully configured; mobile push is disabled."
          fi

      - name: Deploy production relay stage
        if: steps.cloudflare_config.outputs.enabled == 'true'
        id: deploy
        run: vp run --filter t3code-relay deploy --stage prod --yes --github-output
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          PLANETSCALE_API_TOKEN_ID: ${{ secrets.PLANETSCALE_API_TOKEN_ID }}
          PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}

      - name: Publish relay deploy commit status
        if: steps.cloudflare_config.outputs.enabled == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const result = "${{ steps.deploy.outputs.result }}";
            const changed = "${{ steps.deploy.outputs.changed }}" === "true";
            const description = changed
              ? "Relay production deploy applied infrastructure changes."
              : result === "noop"
                ? "Relay production deploy was a no-op."
                : `Relay production deploy completed with result: ${result}.`;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "success",
              context: "Relay deploy / production",
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
